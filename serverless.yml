service: ai-be-dev

frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: dev
  environment:
    BEDROCK_API_KEY: ${env:BEDROCK_API_KEY}
    BEDROCK_MODEL_ID: ${env:BEDROCK_MODEL_ID}
    DYNAMO_TABLE_USERS: ${self:provider.stage}-users
    DYNAMO_TABLE_ROLES: ${self:provider.stage}-roles
    JWT_SECRET: ${env:JWT_SECRET}
    NODE_ENV: dev
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:DescribeTable
            - bedrock:InvokeModel
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMO_TABLE_USERS}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMO_TABLE_USERS}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMO_TABLE_ROLES}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMO_TABLE_ROLES}/index/*
            - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-haiku-20240307-v1:0

package:
  individually: true
  patterns:
    - "!node_modules/.bin/**"
    - "dist/**"

functions:
  login:
    handler: dist/handlers/auth/login.handler
    events:
      - httpApi:
          path: /api/v1/login
          method: post
  logout:
    handler: dist/handlers/auth/logout.handler
    events:
      - httpApi:
          path: /api/v1/logout
          method: post
  getMe:
    handler: dist/handlers/me/get-me.handler
    events:
      - httpApi:
          path: /api/v1/me
          method: get
  getMePosts:
    handler: dist/handlers/me/get-posts.handler
    events:
      - httpApi:
          path: /api/v1/me/posts
          method: get
  getMePostDetail:
    handler: dist/handlers/me/get-post-detail.handler
    events:
      - httpApi:
          path: /api/v1/me/posts/{postId}
          method: get
  getMePostComments:
    handler: dist/handlers/me/get-post-comments.handler
    events:
      - httpApi:
          path: /api/v1/me/posts/{postId}/comments
          method: get
  createRole:
    handler: dist/handlers/roles/create-role.handler
    events:
      - httpApi:
          path: /api/v1/roles
          method: post
  getRoles:
    handler: dist/handlers/roles/get-roles.handler
    events:
      - httpApi:
          path: /api/v1/roles
          method: get
  getRoleById:
    handler: dist/handlers/roles/get-role-by-id.handler
    events:
      - httpApi:
          path: /api/v1/roles/{roleId}
          method: get
  createUser:
    handler: dist/handlers/users/create-user.handler
    events:
      - httpApi:
          path: /api/v1/users
          method: post
  getUsers:
    handler: dist/handlers/users/get-users.handler
    events:
      - httpApi:
          path: /api/v1/users
          method: get
  getUserById:
    handler: dist/handlers/users/get-user-by-id.handler
    events:
      - httpApi:
          path: /api/v1/users/{userId}
          method: get
  getPosts:
    handler: dist/handlers/posts/get-posts.handler
    events:
      - httpApi:
          path: /api/v1/posts
          method: get
  getPostById:
    handler: dist/handlers/posts/get-post-by-id.handler
    events:
      - httpApi:
          path: /api/v1/posts/{postId}
          method: get
  getComments:
    handler: dist/handlers/comments/get-comments.handler
    events:
      - httpApi:
          path: /api/v1/comments
          method: get
  getCommentById:
    handler: dist/handlers/comments/get-comment-by-id.handler
    events:
      - httpApi:
          path: /api/v1/comments/{commentId}
          method: get
  postAnalytics:
    handler: dist/handlers/comments/post-analytics.handler
    events:
      - httpApi:
          path: /api/v1/comment/analytics
          method: post

custom:
  serverless-offline:
    httpPort: 3000
    reloadHandler: true

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.stage}-users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: email-index
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    RolesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.stage}-roles
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
